services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "${REDIS__PORT:-6379}:6379"

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db
