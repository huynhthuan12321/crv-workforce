services:
  api:
    build: .
    command: python -m source.api_main
    restart: unless-stopped
    env_file: [.env]
    environment: {TZ: Asia/Ho_Chi_Minh}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [app-network]

  bot:
    build: .
    command: python -m source.bot_main
    env_file: [.env]
    environment: {TZ: Asia/Ho_Chi_Minh}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/app/source/utils/bot_healthcheck.py"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    networks: [app-network]

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:5432:5432"]
    env_file: [.env]
    environment:
      POSTGRES_USER: ${DB__USER:-default}
      POSTGRES_PASSWORD: ${DB__PASSWORD:-password}
      POSTGRES_DB: ${DB__NAME:-crv_workforce}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB__USER:-default} -d ${DB__NAME:-crv_workforce}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app-network]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS__PASSWORD:-password}
    environment: {TZ: Asia/Ho_Chi_Minh}
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS__PASSWORD:-password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app-network]

  webapp:
    build: {context: ., dockerfile: webapp.Dockerfile}
    restart: unless-stopped
    environment: {TZ: Asia/Ho_Chi_Minh}
    networks: [app-network]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [api, webapp]
    networks: [app-network]

volumes:
  db_data:
  redis_data:
networks:
  app-network:
